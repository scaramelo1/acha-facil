# Acha Fácil no domínio próprio: achafacilapp.com.br serve a mesma pasta de fsadesigners.com.br/acha-facil
# Instalado por servidor/dominio/ativar.sh (o certbot cria a versão HTTPS, achafacilapp-le-ssl.conf)
<VirtualHost *:80>
    ServerName achafacilapp.com.br
    ServerAlias www.achafacilapp.com.br
    DocumentRoot /var/www/acha-facil/servidor/publico
    DirectoryIndex index.php index.html
    <Directory /var/www/acha-facil/servidor/publico>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog ${APACHE_LOG_DIR}/fsadesigners_erro.log
    SetEnvIf Request_URI "^/api/perto\.php$" sem_localizacao
    CustomLog ${APACHE_LOG_DIR}/achafacilapp_acesso.log combined env=!sem_localizacao
    CustomLog ${APACHE_LOG_DIR}/achafacilapp_acesso.log "%h %l %u %t \"%m %U %H\" %>s %O \"%{Referer}i\" \"%{User-Agent}i\"" env=sem_localizacao
</VirtualHost>
